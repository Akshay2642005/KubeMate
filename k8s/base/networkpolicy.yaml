apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-agent-web
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-agent
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
  egress:
    # The web tier talks to Postgres and the runner Service only. It never
    # reaches the Kubernetes API server or the model provider directly.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent-postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent
              app.kubernetes.io/component: runner
      ports:
        - port: 3000
    - to:
        - namespaceSelector: {}
      ports:
        # DNS runs on UDP 53 primarily; TCP 53 serves large responses and
        # zone transfers. Both are required for resolution to work.
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 853
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-agent-runner
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-agent
      app.kubernetes.io/component: runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent
              app.kubernetes.io/component: web
      ports:
        - port: 3000
  egress:
    # Postgres is an in-cluster pod.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent-postgres
      ports:
        - port: 5432
    # TCP 443 covers the Kubernetes API server and the model provider. Both
    # are typically external endpoints, so namespaceSelector cannot match
    # them — an ipBlock is required.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
    # DNS: kube-dns lives in a namespace, but keep the peer broad and rely on
    # the port restriction; UDP 53 is the important one.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 853
          protocol: TCP
