apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-agent-web
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-agent
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 3000
  egress:
    # The web tier talks to Postgres and the runner Service only. It never
    # reaches the Kubernetes API server or the model provider directly.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent-postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent
              app.kubernetes.io/component: runner
      ports:
        - port: 3000
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
        - port: 853
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubernetes-agent-runner
  labels:
    app.kubernetes.io/name: kubernetes-agent
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-agent
      app.kubernetes.io/component: runner
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kubernetes-agent
              app.kubernetes.io/component: web
      ports:
        - port: 3000
  egress:
    # The runner talks to the API server, Postgres, the model provider, and DNS.
    - to: []
      ports:
        - port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - port: 443
    - to: []
      ports:
        - port: 53
        - port: 853