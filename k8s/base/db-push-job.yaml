apiVersion: batch/v1
kind: Job
metadata:
  name: kubernetes-agent-db-push
  labels:
    app.kubernetes.io/name: kubernetes-agent-db-push
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-agent-db-push
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: kubernetes-agent:local
          imagePullPolicy: IfNotPresent
          # drizzle.config.ts resolves ./db relative to the working directory
          workingDir: /opt/migrator
          command:
            [
              "bun",
              "/opt/migrator/node_modules/drizzle-kit/bin.cjs",
              "push",
              "--force",
              "--config",
              "/opt/migrator/drizzle.config.ts",
            ]
          env:
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent-secrets
                  key: DATABASE_PASSWORD
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_NAME
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_PORT
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_NAME
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: kubernetes-agent-config
                  key: DATABASE_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent-secrets
                  key: DATABASE_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
