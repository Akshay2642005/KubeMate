apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-agent-approved-writer
rules:
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["patch"]
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["create", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["patch"]
