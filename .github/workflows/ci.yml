name: KubeMate CI/CD

on:
  pull_request:
  push:
    tags: ["*.*.*"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Next.js collects route configuration during build; Kubernetes injects
      # the actual connection string into the running application container.
      DATABASE_URL: postgresql://kubernetes_agent:kubernetes_agent@localhost:5432/kubernetes_agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Lint (advisory)
        # Existing React 19 starter components currently fail these rules.
        continue-on-error: true
        run: bun run lint
      - run: bun run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: echo "image=ghcr.io/${REPOSITORY,,}:${TAG}" >> "$GITHUB_OUTPUT"

  update-manifest:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE: ${{ needs.publish.outputs.image }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Update production image
        run: |
          image_name="${IMAGE%:*}"
          sed -i.bak \
            -e "s|^    newName:.*|    newName: ${image_name}|" \
            -e "s|^    newTag:.*|    newTag: ${TAG}|" \
            k8s/production/kustomization.yaml
          rm k8s/production/kustomization.yaml.bak
      - name: Commit production image reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/production/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): point production manifest to ${TAG}"
          git push origin HEAD:master
